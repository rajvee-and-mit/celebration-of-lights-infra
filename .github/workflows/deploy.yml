name: Validate and deploy infrastructure

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: infrastructure-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Build and synthesize
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Synthesize CloudFormation template
        run: npm run synth
        env:
          UI_BUCKET_NAME: ${{ vars.UI_BUCKET_NAME || 'celebration-of-lights-ui' }}

  deploy:
    name: Deploy to AWS
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy CDK stack
        run: npm run deploy -- --require-approval never
        env:
          UI_BUCKET_NAME: ${{ vars.UI_BUCKET_NAME || 'celebration-of-lights-ui' }}

